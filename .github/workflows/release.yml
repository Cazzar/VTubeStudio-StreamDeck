name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to.
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test DeckKit.slnx -c Release -p:BuildPropertyInspector=false

  package:
    name: Package
    needs: test
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
      version: ${{ github.event.release.name || github.event.release.tag_name || inputs.tag }}

  attach:
    name: Attach to release
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: vtubestudio-*
          merge-multiple: true
          path: dist

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag }}" \
            dist/*.streamDeckPlugin dist/*.zip --clobber
