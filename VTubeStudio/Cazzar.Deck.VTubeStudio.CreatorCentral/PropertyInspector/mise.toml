[tools]
node = "24"
npm = "12"

[tasks.install]
description = "Install dependencies"
run = "npm install --no-audit --no-fund"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.dev]
description = "Serve the property view with hot reload"
depends = ["install"]
run = "npm run dev"

[tasks.build]
description = "Build the property view into ../package/PropertyInspector"
depends = ["install"]
run = "npm run build"

[tasks.lint]
description = "Lint the property view"
depends = ["install"]
run = "npm run lint"
